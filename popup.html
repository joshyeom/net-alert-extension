<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      body {
        width: 248px;
        margin: 0;
        padding: 16px;
        background: #fafafa;
        color: #222;
      }
      /* 헤더: 제목 + 설정 톱니 */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .header h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        color: #555;
      }
      .iconBtn {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 16px;
        padding: 2px 4px;
        border-radius: 5px;
        color: #888;
      }
      .iconBtn:hover {
        background: #eee;
      }

      /* ---- 메인 뷰 ---- */
      #main {
        text-align: center;
      }
      #dot {
        font-size: 40px;
        line-height: 1;
      }
      #label {
        margin-top: 10px;
        font-size: 18px;
        font-weight: 600;
      }
      #sub {
        margin-top: 6px;
        font-size: 12px;
        color: #777;
      }
      .offline #label {
        color: #e53935;
      }
      .online #label {
        color: #43a047;
      }
      #speedBox {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #eee;
        text-align: left;
      }
      #speedNow {
        font-size: 13px;
        color: #333;
      }
      #speedNow b {
        font-size: 15px;
      }
      .slow #speedNow b {
        color: #e53935;
      }
      #speedRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #btnSpeedNow {
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        color: #444;
        font-size: 11px;
        padding: 4px 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      #btnSpeedNow:hover:not(:disabled) {
        background: #f0f0f0;
      }
      #btnSpeedNow:disabled {
        color: #aaa;
        cursor: default;
      }
      #speedErr {
        display: none;
        margin-top: 6px;
        font-size: 11px;
        color: #e53935;
      }
      #speedErr.show {
        display: block;
      }
      /* 끊김 기록 요약 행 — 누르면 기록 뷰 */
      #histSummary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #eee;
        font-size: 12px;
        color: #555;
        cursor: pointer;
        text-align: left;
      }
      #histSummary:hover {
        color: #222;
      }
      #histSummary .chev {
        color: #aaa;
      }
      /* 리뷰 요청 배너 — 복구 3회 이상, 닫으면 다시 안 뜸 */
      #review {
        display: none;
        position: relative;
        margin-top: 12px;
        padding: 10px 26px 10px 12px;
        background: #e8f5e9;
        border: 1px solid #a5d6a7;
        border-radius: 8px;
        font-size: 12px;
        color: #2e5d31;
        text-align: left;
        line-height: 1.5;
      }
      #review.show {
        display: block;
      }
      #reviewClose {
        position: absolute;
        top: 4px;
        right: 4px;
        border: none;
        background: none;
        color: #7a9a7c;
        font-size: 13px;
        cursor: pointer;
        padding: 2px 5px;
      }
      #btnReview {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 6px 0;
        border: none;
        border-radius: 6px;
        background: #43a047;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #btnReview:hover {
        background: #388e3c;
      }

      /* ---- 설정 뷰 / 기록 뷰 ---- */
      #settings,
      #history {
        display: none;
      }
      body.settingsOpen #main,
      body.historyOpen #main {
        display: none;
      }
      body.settingsOpen #settings {
        display: block;
      }
      body.historyOpen #history {
        display: block;
      }
      /* 기록 뷰: 7일 통계 3칸 + 목록 */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin: 4px 0 10px;
      }
      .stat {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 8px 3px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 13px;
        white-space: nowrap;
        color: #222;
      }
      .stat span {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        color: #888;
      }
      #histList {
        max-height: 220px;
        overflow-y: auto;
        font-size: 12px;
      }
      #histList .hrow {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
        color: #444;
      }
      #histList .hrow b {
        font-weight: 600;
        color: #e53935;
      }
      #histEmpty {
        padding: 18px 0;
        text-align: center;
        font-size: 12px;
        color: #999;
      }
      #histNote {
        margin-top: 6px;
        font-size: 10px;
        color: #999;
      }
      #btnHistClear {
        display: block;
        margin: 10px auto 0;
        border: none;
        background: none;
        color: #888;
        font-size: 11px;
        cursor: pointer;
        text-decoration: underline;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 0;
        font-size: 13px;
        border-bottom: 1px solid #eee;
      }
      .row:last-child {
        border-bottom: none;
      }
      .row label {
        color: #444;
      }
      .group-title {
        margin: 12px 0 2px;
        font-size: 11px;
        font-weight: 600;
        color: #999;
        text-transform: uppercase;
      }
      select,
      input[type="number"] {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 12px;
        background: #fff;
      }
      input[type="number"] {
        width: 52px;
        text-align: right;
      }
      /* 토글 스위치 */
      .switch {
        position: relative;
        width: 38px;
        height: 22px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #ccc;
        border-radius: 22px;
        transition: 0.2s;
        cursor: pointer;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 2px;
        top: 2px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      .switch input:checked + .slider {
        background: #43a047;
      }
      .switch input:checked + .slider::before {
        transform: translateX(16px);
      }
      .threshUnit {
        font-size: 12px;
        color: #888;
        margin-left: 4px;
      }
      .threshWrap {
        display: flex;
        align-items: center;
      }

      /* ---- 권한 배너 (공통) ---- */
      #perm {
        display: none;
        margin-top: 16px;
        padding: 10px 12px;
        background: #fff3e0;
        border: 1px solid #ffcc80;
        border-radius: 8px;
        font-size: 12px;
        color: #8a5a00;
        text-align: left;
        line-height: 1.5;
      }
      #perm.show {
        display: block;
      }
      #perm b {
        color: #b35900;
      }
      #permBtn {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 7px 0;
        border: none;
        border-radius: 6px;
        background: #ff9800;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #permBtn:hover {
        background: #f57c00;
      }
      #permGuide {
        display: none;
        margin-top: 8px;
        font-size: 11px;
        color: #8a5a00;
      }
      #permGuide.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1 id="hdrTitle"></h1>
      <button id="openSettings" class="iconBtn" title="settings">⚙️</button>
    </div>

    <!-- 메인 뷰 -->
    <div id="main">
      <div style="text-align: center">
        <div id="dot">⚪</div>
        <div id="label"></div>
        <div id="sub"></div>
      </div>
      <div id="speedBox">
        <div id="speedRow">
          <div id="speedNow"></div>
          <button id="btnSpeedNow"></button>
        </div>
        <div id="speedErr"></div>
      </div>
      <div id="histSummary">
        <span id="histSummaryText"></span>
        <span class="chev">›</span>
      </div>
      <div id="review">
        <button id="reviewClose">✕</button>
        <span id="reviewAsk"></span>
        <button id="btnReview"></button>
      </div>
    </div>

    <!-- 끊김 기록 뷰 -->
    <div id="history">
      <div class="header">
        <h1 id="histTitle"></h1>
        <button id="closeHistory" class="iconBtn" title="done">✕</button>
      </div>
      <div class="group-title" id="histWeek"></div>
      <div class="stats">
        <div class="stat"><b id="stCount">0</b><span id="lblHistCount"></span></div>
        <div class="stat"><b id="stTotal">—</b><span id="lblHistTotal"></span></div>
        <div class="stat"><b id="stLongest">—</b><span id="lblHistLongest"></span></div>
      </div>
      <div id="histList"></div>
      <div id="histEmpty"></div>
      <div id="histNote"></div>
      <button id="btnHistClear"></button>
    </div>

    <!-- 설정 뷰 -->
    <div id="settings">
      <div class="header">
        <h1 id="setTitle"></h1>
        <button id="closeSettings" class="iconBtn" title="done">✕</button>
      </div>

      <div class="row">
        <label id="lblLang"></label>
        <select id="selLang">
          <option value="system" id="optSystem"></option>
          <option value="ko" id="optKo"></option>
          <option value="en" id="optEn"></option>
          <option value="es" id="optEs"></option>
          <option value="id" id="optId"></option>
          <option value="tr" id="optTr"></option>
          <option value="pt_BR" id="optPtBr"></option>
          <option value="pl" id="optPl"></option>
        </select>
      </div>

      <div class="group-title" id="grpSpeed"></div>
      <div class="row">
        <label id="lblSpeedTest"></label>
        <label class="switch"
          ><input type="checkbox" id="swSpeedTest" /><span
            class="slider"
          ></span
        ></label>
      </div>
      <div class="row">
        <label id="lblThreshold"></label>
        <span class="threshWrap">
          <input id="threshold" type="number" min="1" step="1" />
          <span class="threshUnit">Mbps</span>
        </span>
      </div>
      <div class="row">
        <label id="lblPeriod"></label>
        <select id="selPeriod">
          <option value="5" id="optP5"></option>
          <option value="10" id="optP10"></option>
          <option value="30" id="optP30"></option>
        </select>
      </div>

      <div class="group-title" id="grpNotify"></div>
      <div class="row">
        <label id="lblNotifyDown"></label>
        <label class="switch"
          ><input type="checkbox" id="swNotifyDown" /><span
            class="slider"
          ></span
        ></label>
      </div>
      <div class="row">
        <label id="lblNotifyUp"></label>
        <label class="switch"
          ><input type="checkbox" id="swNotifyUp" /><span
            class="slider"
          ></span
        ></label>
      </div>
      <div class="row">
        <label id="lblNotifySlow"></label>
        <label class="switch"
          ><input type="checkbox" id="swNotifySlow" /><span
            class="slider"
          ></span
        ></label>
      </div>
    </div>

    <!-- 권한 배너 (양 뷰 공통, 아래 고정) -->
    <div id="perm">
      <b id="permTitle"></b><br />
      <span id="permBody"></span>
      <button id="permBtn"></button>
      <div id="permGuide"></div>
    </div>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
