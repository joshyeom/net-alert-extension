<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1400px; height: 560px;
        font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
        display: flex; align-items: center; justify-content: center; gap: 80px; overflow: hidden; padding: 0 80px;
      }
      .left { color: #fff; max-width: 640px; }
      .left .ic { width: 64px; height: 64px; border-radius: 15px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 22px; }
      .left h1 { font-size: 56px; font-weight: 800; line-height: 1.15; letter-spacing: -1.5px; }
      .left p { margin-top: 18px; font-size: 23px; opacity: 0.92; line-height: 1.5; }
      .right { display: flex; flex-direction: column; gap: 18px; }
      .notif { width: 380px; background: rgba(20,20,20,0.95); border-radius: 14px; padding: 16px 18px; display: flex; align-items: center; gap: 13px; box-shadow: 0 18px 44px rgba(0,0,0,0.4); }
      .notif .nic { width: 42px; height: 42px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
      .down .nic { background: #e53935; }
      .up .nic { background: #43a047; }
      .notif .txt { color: #fff; }
      .notif .t1 { font-size: 16px; font-weight: 700; }
      .notif .t2 { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="ic">📶</div>
      <h1>와이파이는 멀쩡한데<br />인터넷이 안 될 때</h1>
      <p>실제 연결을 확인해 끊긴 순간과 복구된 순간을 즉시 알려드립니다.</p>
    </div>
    <div class="right">
      <div class="notif down">
        <div class="nic">⚠️</div>
        <div class="txt"><div class="t1">인터넷 끊김</div><div class="t2">14:32 연결이 끊겼습니다</div></div>
      </div>
      <div class="notif up">
        <div class="nic">✅</div>
        <div class="txt"><div class="t1">인터넷 복구됨</div><div class="t2">3분 12초 만에 복구</div></div>
      </div>
    </div>
  </body>
</html>
