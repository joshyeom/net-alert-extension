<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1280px; height: 800px;
        font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
        display: flex; align-items: center; justify-content: center; gap: 64px; overflow: hidden;
      }
      .copy { color: #fff; max-width: 500px; }
      .copy h1 { font-size: 50px; line-height: 1.2; font-weight: 800; letter-spacing: -1px; }
      .copy p { margin-top: 20px; font-size: 21px; line-height: 1.6; opacity: 0.92; }
      .feat { margin-top: 28px; list-style: none; }
      .feat li { font-size: 18px; margin: 11px 0; display: flex; align-items: center; gap: 10px; }
      .stage { display: flex; flex-direction: column; gap: 22px; align-items: center; }
      .popup { width: 280px; background: #fafafa; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); padding: 22px 20px; text-align: center; }
      .popup .hdr { font-size: 13px; color: #888; text-align: left; margin-bottom: 6px; display: flex; justify-content: space-between; }
      .dot { font-size: 46px; }
      .label { font-size: 22px; font-weight: 700; color: #43a047; margin-top: 8px; }
      .sub { font-size: 13px; color: #999; margin-top: 6px; }
      .speed { margin-top: 16px; padding-top: 14px; border-top: 1px solid #eee; text-align: left; font-size: 14px; color: #333; }
      .speed b { font-size: 16px; }
      .notif { width: 360px; background: rgba(30,30,30,0.96); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
      .notif .ic { width: 40px; height: 40px; border-radius: 9px; background: #1e88e5; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
      .notif .txt { color: #fff; text-align: left; }
      .notif .t1 { font-size: 15px; font-weight: 700; }
      .notif .t2 { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1>와이파이 아이콘은<br />거짓말을 합니다.</h1>
      <p>신호가 가득 차 있어도 그건 공유기까지만 연결됐다는 뜻 — 실제 인터넷이 끊긴 순간을 즉시 알려드립니다.</p>
      <ul class="feat">
        <li>🔴 인터넷이 끊기면 즉시 알림</li>
        <li>🟢 복구 시 끊겨 있던 시간 표시</li>
        <li>🐢 속도 저하 경고 (선택)</li>
        <li>🔒 추적 없음 — 모든 데이터는 기기 안에</li>
      </ul>
    </div>
    <div class="stage">
      <div class="notif">
        <div class="ic">📶</div>
        <div class="txt">
          <div class="t1">⚠️ 인터넷 끊김</div>
          <div class="t2">14:32 연결이 끊겼습니다</div>
        </div>
      </div>
      <div class="popup">
        <div class="hdr"><span>인터넷 연결 상태</span><span>⚙️</span></div>
        <div class="dot">🟢</div>
        <div class="label">연결됨</div>
        <div class="sub">마지막 확인: 14:35:02</div>
        <div class="speed">속도: <b>87.4 Mbps</b></div>
      </div>
    </div>
  </body>
</html>
