<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 440px; height: 280px;
        font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #fff; text-align: center; overflow: hidden; padding: 24px;
      }
      .ic { width: 76px; height: 76px; border-radius: 18px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-size: 42px; margin-bottom: 16px; }
      h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
      p { margin-top: 10px; font-size: 15px; opacity: 0.9; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="ic">📶</div>
    <h1>인터넷 끊김 알림</h1>
    <p>끊긴 순간, 복구된 순간<br />즉시 알려드립니다</p>
  </body>
</html>
