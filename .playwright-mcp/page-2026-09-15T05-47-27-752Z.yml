      - heading "Features & Capabilities" [level=2] [ref=f75e200]
      - generic [ref=f75e204]:
        - paragraph [ref=f75e205]: ICM provides real-time Internet connectivity monitoring for Chrome. It tests connectivity at configurable intervals, uses a customizable ping URL, and measures latency. The extension shows your public IP, detects when the Internet is unavailable despite LAN being up, and helps identify ISP or hardware issues. It logs outages and exports data as CSV or PDF.
        - paragraph [ref=f75e206]: New in v6.1, ICM adds JSON backup/restore of logs, icon overlays with latency and outages, and insights by hour-of-day and day-of-week, along with a refreshed UI for a smoother experience. It works across Chromium-based browsers that support Chrome extensions.
