      - heading "User Reviews" [level=2] [ref=f75e428]
      - generic [ref=f75e432]: Users praise Internet Connection Monitor for detailed logs, charts, multiple reports, ease of use, and light resource use, with clear value for proving outages to an ISP. However, several reviews note reliability and logging accuracy issues, including missed outages and inflated disconnect counts. A couple of feature requests recur, such as Dark Mode, latency display on the icon, and showing public IP with country flag.
      - generic [ref=f75e434]:
        - generic [ref=f75e435]:
          - generic [ref=f75e436]: Pros
          - list [ref=f75e439]:
            - listitem [ref=f75e440]: Comprehensive outage logs with charts and multiple report options.
            - listitem [ref=f75e441]: Easy to use with a clean, simple interface.
            - listitem [ref=f75e442]: Lightweight and low resource usage.
            - listitem [ref=f75e443]: Helpful for proving outages to ISPs by providing times and duration of disconnects.
        - generic [ref=f75e444]:
          - generic [ref=f75e445]: Cons
          - list [ref=f75e448]:
            - listitem [ref=f75e449]: Outages are not logged reliably at times; disconnect counts can be incorrect.
            - listitem [ref=f75e450]: Occasional reliability issues where the extension stops working or misreports status.
            - listitem [ref=f75e451]: Missing features suggested by users (Dark Mode, latency on the icon, and showing the public IP with country flag).
      - heading "Recent reviews" [level=5] [ref=f75e452]
      - generic [ref=f75e453]:
