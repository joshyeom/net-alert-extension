      - heading "Is Internet Connection Monitor Safe?" [level=2] [ref=f75e469]
      - generic [ref=f75e473]:
        - generic [ref=f75e475]:
          - heading "Risk impact" [level=6] [ref=f75e476]
          - generic [ref=f75e477]: Risk impact measures the level of extra permissions an extension has access to. A low risk impact extension cannot do much harms, whereas a high risk impact extension can do a lot of damage like stealing your password, bypassing your security settings, and accessing your personal data. High risk impact extensions are not necessarily malicious. However, if they do turn malicious, they can be very harmful.
          - img [ref=f75e479]:
            - generic [ref=f75e486]: Very low risk impact
          - paragraph [ref=f75e490]: Internet Connection Monitor does not require any sensitive permissions.
          - heading "Risk impact analysis details" [level=6] [ref=f75e491]
          - list
        - generic [ref=f75e493]:
          - heading "Risk likelihood" [level=6] [ref=f75e494]
          - generic [ref=f75e495]: Risk likelihood measures the probability that a Chrome extension may turn malicious. This is determined by the publisher and the Chrome extension reputation on Chrome Web Store, the amount of time the Chrome extension has been around, and other signals about the Chrome extension. Our algorithms are not perfect, and are subject to change as we discover new ways to detect malicious extensions. We recommend that you always exercise caution when installing a Chrome extension.
          - img [ref=f75e498]:
            - generic [ref=f75e505]: Very low risk likelihood
          - paragraph [ref=f75e509]: Internet Connection Monitor has earned a good reputation and can be trusted.
          - heading "Risk likelihood analysis details" [level=6] [ref=f75e510]
